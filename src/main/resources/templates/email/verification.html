<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>[Y-Fin.] 알림 받을 이메일을 확인해 주세요</title>
<!--[if !mso]><!-->
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" rel="stylesheet">
<style>body,table,td,a,p,h1,div{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',Arial,sans-serif !important;}</style>
<!--<![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f2f3f5;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f2f3f5;">아래 버튼을 누르면 알림 설정이 완료돼요. 24시간 안에 눌러주세요.</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f3f5;">
<tr><td align="center" style="padding:40px 12px;">

  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',Arial,sans-serif;">

    <tr><td style="background-color:#ffffff;border:1px solid #e5e7eb;border-radius:16px;padding:40px;">

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td align="left" valign="middle">
            <img src="{{assets.logoUrl}}" width="90" height="53" alt="Y-Fin" style="display:block;border:0;color:#03bfa5;font-size:28px;font-weight:bold;">
          </td>
          <td align="right" valign="middle" style="font-size:12px;line-height:18px;color:#8a8f99;">이메일 인증</td>
        </tr>
      </table>

      <h1 style="margin:32px 0 0;font-size:26px;line-height:36px;font-weight:700;color:#222222;">알림 받을 이메일을<br>확인해 주세요</h1>

      <p style="margin:24px 0 0;font-size:15px;line-height:24px;color:#222222;">아래 버튼을 누르면 알림 설정이 완료돼요. <b>24시간 안에</b> 눌러주세요.</p>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:24px;">
        <tr><td align="center" bgcolor="#03bfa5" style="background-color:#03bfa5;border-radius:10px;">
          <a href="{{links.verify}}" target="_blank" style="display:block;padding:16px 0;font-size:16px;line-height:24px;font-weight:600;color:#ffffff;text-decoration:none;">이메일 인증하기</a>
        </td></tr>
      </table>

      <p style="margin:20px 0 0;font-size:12px;line-height:18px;color:#8a8f99;text-align:center;">본인이 신청하지 않았다면 이 메일을 무시해 주세요. 인증하지 않으면 알림은 보내지 않아요.</p>

    </td></tr>

    <tr><td style="padding:24px 28px 0;font-size:12px;line-height:18px;color:#8a8f99;">
      이 메일은 Y-Fin.에서 알림 받기를 신청한 이메일 주소로 보내는 확인 메일이에요.<br><br>
      Y-Fin. · {{company.address}} · {{company.supportEmail}}
    </td></tr>

  </table>

</td></tr>
</table>
</body>
</html>
