plugins {
    id 'java'
    id 'jacoco'
    id 'pmd'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'apptive'
version = '0.0.1-SNAPSHOT'
description = 'fin'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

jacoco {
    toolVersion = '0.8.13'
}

pmd {
    toolVersion = '7.27.0'
    ruleSetFiles = files('config/pmd/ruleset.xml')
    ruleSets = []
    ignoreFailures = true
}

configurations {
    cpdRuntime
}

sourceSets {
    reset {
        java {
            srcDir 'src/reset/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.resources
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    //implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    compileOnly 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    annotationProcessor 'org.projectlombok:lombok'

    //testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    //testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    cpdRuntime 'net.sourceforge.pmd:pmd-cli:7.27.0'
    cpdRuntime 'net.sourceforge.pmd:pmd-java:7.27.0'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

def integrationTest = tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (IntegrationTestSupport subclasses, Testcontainers).'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn integrationTest
}

// 아래 태스크는 PR 코드 헬스 리포트(.github/workflows/backend-code-health.yml)용이며 빌드를 실패시키지 않는다.
['pmdTest', 'pmdReset'].each { name ->
    tasks.named(name) { enabled = false }
}

tasks.withType(Pmd).configureEach {
    reports {
        xml.required = true
        html.required = false
    }
}

def jacocoCombinedReport = tasks.register('jacocoCombinedReport', JacocoReport) {
    description = 'Generates combined JaCoCo coverage for unit and integration tests.'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    dependsOn tasks.named('test'), integrationTest
    executionData(
            layout.buildDirectory.file('jacoco/test.exec'),
            layout.buildDirectory.file('jacoco/integrationTest.exec'),
    )
    sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom(sourceSets.main.output)
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/combined.xml')
        html.required = false
        csv.required = false
    }
}

def cpdMain = tasks.register('cpdMain', JavaExec) {
    description = 'Generates a PMD CPD report for production Java sources.'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    classpath = configurations.cpdRuntime
    mainClass = 'net.sourceforge.pmd.cli.PmdCli'

    def reportFile = layout.buildDirectory.file('reports/cpd/main.xml')
    inputs.dir('src/main/java')
    outputs.file(reportFile)
    doFirst {
        reportFile.get().asFile.parentFile.mkdirs()
    }
    args(
            'cpd',
            '--minimum-tokens', '100',
            '--language', 'java',
            '--format', 'xml',
            '--report-file', reportFile.get().asFile.absolutePath,
            '--no-fail-on-violation',
            '--dir', file('src/main/java').absolutePath,
            '--relativize-paths-with', projectDir.absolutePath,
    )
}

tasks.register('codeHealthReports') {
    description = 'Generates coverage, PMD, and CPD reports for the code health bot.'
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    dependsOn jacocoCombinedReport, tasks.named('pmdMain'), cpdMain
}

tasks.register('resetDb', JavaExec) {
    group = 'devtools'
    description = 'Resets the local development database with Flyway migrations and optional product seed data.'
    classpath = sourceSets.reset.runtimeClasspath
    mainClass = 'apptive.fin.devtools.ResetDatabase'
}
