name: Backend CI

on:
  # 필수 체크로 걸 수 있도록 모든 PR에서 돈다(paths 필터로 스킵되면 필수 체크가 대기 상태로 남는다).
  pull_request:
  # main·release push 때는 deploy.yml이 배포 전에 호출한다.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    # application.yml이 요구하는 값. CI에는 .env가 없으므로 더미 값을 주입한다(JWT는 32바이트 이상).
    env:
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
      KAKAO_CLIENT_ID: ci-dummy
      KAKAO_CLIENT_SECRET: ci-dummy
      JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef0123456789
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: bash ./gradlew test

      - name: Run integration tests
        run: bash ./gradlew integrationTest
