name: Backend CI

on:
  pull_request:
    paths:
      - "src/**"
      - "config/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    # application-dev.yml이 요구하는 값. CI에는 .env가 없으므로 더미 값을 주입한다(JWT는 32바이트 이상).
    env:
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
      KAKAO_CLIENT_ID: ci-dummy
      KAKAO_CLIENT_SECRET: ci-dummy
      JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef0123456789
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: bash ./gradlew test

      - name: Run integration tests
        run: bash ./gradlew integrationTest
